name: Art Valley ticket watch
on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min (GitHub minimum), off the busy :00 minute
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert to the phone instead of checking"
        type: boolean
        default: false
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Check Triniq resale
        run: python3 art_valley_watch.py ${{ inputs.test && '--test' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_DIR: .state
          DAILY_CHECKIN: "1"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: watch-state-${{ github.run_id }}
